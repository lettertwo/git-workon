name: Release-plz

on:
  push:
    branches: [main]

jobs:
  release-plz-release:
    name: Release tag and cargo publish
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: write
      id-token: write
      actions: write
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Auth with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Trigger release workflow
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          # Dispatch the cargo-dist release workflow once per released binary.
          #
          # This is an explicit allowlist, not "every released package": release-plz
          # tags libraries too (git-workon-lib), and cargo-dist has no App for those,
          # so dispatching on a library tag would start a release run with nothing to
          # build. Packages here must be ones cargo-dist actually builds artifacts for
          # — add a package when it flips to `dist = true` in its Cargo.toml.
          #
          # Independently-versioned binaries release under separate tags, so more than
          # one dispatch per push is expected and each run builds only its own tag.
          DIST_PACKAGES='git-workon'
          for pkg in $DIST_PACKAGES; do
            TAG=$(echo "$RELEASES" | jq -r --arg pkg "$pkg" '.[] | select(.package_name == $pkg) | .tag')
            if [ -n "$TAG" ]; then
              gh workflow run release.yml --field tag="$TAG"
            fi
          done

  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
