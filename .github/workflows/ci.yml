name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-plz-')
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # --all: scope to every workspace crate, not cargo's `default-members`.
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-plz-')
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # --workspace: scope to every workspace crate, not cargo's `default-members`.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # No release-plz guard here: when this job is skipped its name never
  # interpolates, so it reports `Test (${{ matrix.os }})` and the required
  # `Test (ubuntu-latest)`/`Test (macos-latest)` contexts never report at all.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global init.defaultBranch main
      - run: cargo test --workspace
