[package]
authors.workspace = true
categories = ["command-line-utilities", "development-tools"]
description = "TUI for reviewing changesets"
edition.workspace = true
homepage.workspace = true
keywords = ["cli", "git", "review", "tui", "workon"]
license.workspace = true
name = "git-workon-review"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"
include = [
  "src/**/*",
  "Cargo.toml",
  "LICENSE*",
  "README.md",
]
# Not yet published to crates.io: flipping to publish is deferred (a deferrable sub-decision,
# see ADR-033) until the crate is ready to release. At that point: remove this line, add
# `[[package]] name = "git-workon-review"`
# to release-plz.toml (no version_group — versioned independently of the CLI),
# and decide the `dist = false` posture below (the homebrew patch step in
# .github/workflows/release.yml stamps man/completions into every
# Formula/*.rb and must be reworked before this binary can be distributed).
publish = false

[lib]
name = "workon_review"

[features]
vendored = ["git-workon-lib/vendored", "git2/vendored-libgit2", "git2/vendored-openssl"]

[dependencies]
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
devicons.workspace = true
dirs.workspace = true
fuzzy-matcher.workspace = true
git-workon-lib.workspace = true
git2.workspace = true
libc.workspace = true
miette.workspace = true
ratatui.workspace = true
serde_json.workspace = true
similar.workspace = true
thiserror.workspace = true
tree-sitter.workspace = true
tree-sitter-highlight.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-json.workspace = true
tree-sitter-lua.workspace = true
tree-sitter-md.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-typescript.workspace = true
unicode-width.workspace = true

[package.metadata.dist]
# Redundant with publish = false today; load-bearing once the publish flip lands (deferred, see
# ADR-033) so cargo-dist doesn't silently start shipping the (still undesigned) binary.
dist = false

[dev-dependencies]
assert_cmd.workspace = true
assert_fs.workspace = true
expectrl.workspace = true
git-workon-fixture.workspace = true
predicates.workspace = true
