[workspace]
resolver = "2"
default-members = ["git-workon"]
members = ["git-workon", "git-workon-lib", "git-workon-fixture"]

[workspace.package]
authors = ["Eric Eldredge <lettertwo@gmail.com>"]
edition = "2021"
homepage = "https://github.com/lettertwo/git-workon"
license = "MIT"
repository = "https://github.com/lettertwo/git-workon"
rust-version = "1.68.2"

[workspace.dependencies]
assert_cmd = { version = "2.2.2", features = ["color", "color-auto"] }
assert_fs = { version = "1.1.3", features = ["color", "color-auto"] }
clap = { version = "4.6.1", features = [
  "derive",
  "color",
  "wrap_help",
  "unicode",
  "env",
] }
clap-verbosity-flag = "3.0.4"
clap_complete = { version = "4.6.5", features = ["unstable-dynamic"] }
clap_mangen = "0.3.0"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
env_logger = "0.11.10"
git-workon-lib = { version = "0.5.2", path = "./git-workon-lib" }
git-workon-fixture = { path = "./git-workon-fixture" }
auth-git2 = "0.6"
git2 = { version = "0.21.0", default-features = false, features = [
  "ssh",
  "https",
] }
glob = "0.3"
ignore = "0.4"
indicatif = "0.18"
libc = "0.2"
log = "0.4.30"
miette = { version = "7.6.0", features = ["fancy"] }
owo-colors = "4"
predicates = { version = "3.1.4" }
supports-color = "3"
expectrl = "0.9"
pathdiff = "0.2.3"
serde_json = "1.0"
thiserror = "2.0.18"
unicode-width = "0.2.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
